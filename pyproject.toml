[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-demo"
version = "0.1.0"
description = "A small persistent task CLI for iterative coding demos"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-demo = "codex_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
